name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pyflakes httpx
      - name: Lint
        run: python -m pyflakes app.py api worker components logic utils tools tests migrations
      - name: Tests
        run: python -m pytest -q tests

  infra-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r infra/requirements.txt pytest
      - name: Synthesise and check the stacks
        run: python -m pytest -q infra/tests

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ml-auto:ci .
      - name: Boots and answers its health check
        run: |
          docker run -d --name app -e AUTH_MODE=dev -p 8501:8501 ml-auto:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo; echo "healthy after ${i} tries"; exit 0
            fi
            sleep 3
          done
          docker logs app
          exit 1
